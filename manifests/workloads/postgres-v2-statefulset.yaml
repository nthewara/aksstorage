# Postgres 16 on Premium SSD v2 — single-instance, durability-by-disk.
# StorageClass: premium-ssd-v2 (AKS built-in CSI, disk.csi.azure.com).
# NOT managed by ACS. Independent IOPS/throughput dials = 10k IOPS / 200 MB/s
# regardless of disk size (100 GiB here).
#
# Single replica on purpose — durability comes from the PremiumV2_LRS disk
# (3× replicated inside the AZ). Cross-AZ HA needs app-level replication
# (Patroni/CloudNativePG) since v2 has no ZRS yet.
#
# Apply:
#   kubectl apply -f manifests/storageclass/premium-ssd-v2.yaml
#   kubectl apply -f manifests/workloads/postgres-v2-statefulset.yaml
#
apiVersion: v1
kind: Namespace
metadata:
  name: demo-pgv2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-v2-config
  namespace: demo-pgv2
data:
  POSTGRES_DB: demo
  POSTGRES_USER: demo
  PGDATA: /var/lib/postgresql/data/pgdata
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-v2-secret
  namespace: demo-pgv2
type: Opaque
stringData:
  # LAB-ONLY weak password. Never commit anything like this for a real app.
  # Real workloads should pull from Key Vault via CSI secrets-store + MI.
  POSTGRES_PASSWORD: demopass
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-v2-headless
  namespace: demo-pgv2
  labels:
    app: postgres-v2
spec:
  clusterIP: None
  selector:
    app: postgres-v2
  ports:
    - port: 5432
      name: pg
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-v2
  namespace: demo-pgv2
  labels:
    app: postgres-v2
spec:
  type: ClusterIP
  selector:
    app: postgres-v2
  ports:
    - port: 5432
      targetPort: 5432
      name: pg
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-v2
  namespace: demo-pgv2
spec:
  serviceName: postgres-v2-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres-v2
  template:
    metadata:
      labels:
        app: postgres-v2
    spec:
      terminationGracePeriodSeconds: 30
      # Pin to syspool (D4s_v5) — the v2 disk is the perf source, not the node.
      nodeSelector:
        kubernetes.azure.com/agentpool: syspool
      initContainers:
        - name: pgbench-init
          image: postgres:16-alpine
          # Seed scale-100 dataset (~1.5 GB) on first startup only.
          # Waits for postgres in the main container to come up, then runs pgbench -i.
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ -f /var/lib/postgresql/data/pgdata/.pgbench-seeded ]; then
                echo "pgbench already seeded — skipping"
                exit 0
              fi
              echo "Waiting for postgres to accept connections on 127.0.0.1..."
              # init container shares network namespace with main container in same pod
              for i in $(seq 1 60); do
                if pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              echo "Seeding pgbench scale=100..."
              PGPASSWORD="$POSTGRES_PASSWORD" pgbench -h 127.0.0.1 -U "$POSTGRES_USER" -i -s 100 "$POSTGRES_DB"
              touch /var/lib/postgresql/data/pgdata/.pgbench-seeded
              echo "Seed complete."
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: postgres-v2-config, key: POSTGRES_DB }
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: postgres-v2-config, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-v2-secret, key: POSTGRES_PASSWORD }
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
          # NOTE: initContainers normally run BEFORE main containers. This pattern
          # works because the init container will retry pg_isready while postgres
          # is starting up in the same pod via a sidecar-style fork. For strict
          # ordering, run this as a separate Job after the STS is Ready instead.
          # For lab simplicity we keep it inline.
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - configMapRef: { name: postgres-v2-config }
            - secretRef: { name: postgres-v2-secret }
          ports:
            - containerPort: 5432
              name: pg
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -U, demo, -d, demo]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, demo, -d, demo]
            initialDelaySeconds: 30
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: pg-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: premium-ssd-v2
        resources:
          requests:
            storage: 100Gi
