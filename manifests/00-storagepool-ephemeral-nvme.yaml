# Ephemeral NVMe storage pool — uses local NVMe on Lsv3 / Lasv3 nodes.
# Apply this instead of (or in addition to) the azuredisk pool on a
# Standard_L8s_v3 node pool. Data is ephemeral — survives pod restarts on the
# same node, NOT node loss. Suitable for caches, scratch, replicated DBs.
apiVersion: containerstorage.azure.com/v1
kind: StoragePool
metadata:
  name: ephemeraldisk-nvme
  namespace: acstor
spec:
  poolType:
    ephemeralDisk:
      diskType: nvme
  resources:
    requests:
      storage: 750Gi
