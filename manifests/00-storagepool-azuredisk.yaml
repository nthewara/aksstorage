# Azure Container Storage pool — Azure Disk backed.
# Each node contributes a managed Premium SSD that gets pooled and exposed
# via the acstor-azuredisk StorageClass.
apiVersion: containerstorage.azure.com/v1
kind: StoragePool
metadata:
  name: azuredisk-pool
  namespace: acstor
spec:
  poolType:
    azureDisk:
      skuName: Premium_LRS
  resources:
    requests:
      storage: 1Ti
